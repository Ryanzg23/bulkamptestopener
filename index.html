<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk AMP Validator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 10px;
    }

    textarea {
      width: 90%;
      max-width: 600px;
      height: 200px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    #validateBtn {
      background: #28a745;
      color: white;
    }

    #openAllBtn {
      background: #007bff;
      color: white;
      margin-left: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
      max-width: 600px;
    }

    .results {
      margin-top: 25px;
      width: 90%;
      max-width: 600px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
    }

    .results h3 {
      margin-bottom: 15px;
      color: #0ff;
    }

    .amp-link {
      display: inline-block;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00c3ff;
      text-decoration: none;
      padding: 10px 15px;
      margin: 5px 5px 10px 0;
      transition: 0.3s;
      font-size: 15px;
      word-wrap: break-word;
    }

    .amp-link:hover {
      background: #007bff;
      color: #fff;
    }

    .amp-link.clicked {
      background: #444;
      color: #ccc;
      border-color: #555;
    }
  </style>
</head>
<body>
  <h2>Bulk AMP Validator</h2>
  <textarea id="urls" placeholder="Enter URLs here (one per line)..."></textarea>
  <div>
    <button id="validateBtn">Generate AMP Test Links</button>
    <button id="openAllBtn">Open All in New Tabs</button>
  </div>
  <p class="note">
    ⚠️ Note: “Open All” opens multiple tabs at once.<br>
    Please make sure to <strong>allow pop-ups</strong> in your browser for it to work.
  </p>

  <div class="results" id="results"></div>

  <script>
    const validateBtn = document.getElementById('validateBtn');
    const openAllBtn = document.getElementById('openAllBtn');
    const textarea = document.getElementById('urls');
    const resultsDiv = document.getElementById('results');

    validateBtn.addEventListener('click', () => {
      const urls = textarea.value.trim().split('\n').map(u => u.trim()).filter(u => u);
      resultsDiv.innerHTML = '';

      if (urls.length === 0) {
        resultsDiv.innerHTML = '<p style="color:#f77;">Please enter at least one URL.</p>';
        return;
      }

      const linkButtons = urls.map(url => {
        const validatorUrl = `https://search.google.com/test/amp?url=${encodeURIComponent(url)}`;
        return `<a href="${validatorUrl}" target="_blank" class="amp-link">${url}</a>`;
      }).join('');

      resultsDiv.innerHTML = `<h3>Generated AMP Test Links:</h3>${linkButtons}`;

      // Add click event to mark clicked links
      document.querySelectorAll('.amp-link').forEach(link => {
        link.addEventListener('click', () => {
          link.classList.add('clicked');
        });
      });
    });

    openAllBtn.addEventListener('click', () => {
      const urls = textarea.value.trim().split('\n').map(u => u.trim()).filter(u => u);
      if (urls.length === 0) {
        alert('Please enter at least one URL.');
        return;
      }

      urls.forEach((url, index) => {
        setTimeout(() => {
          const validatorUrl = `https://search.google.com/test/amp?url=${encodeURIComponent(url)}`;
          window.open(validatorUrl, '_blank');
        }, index * 400); // small delay between openings
      });
    });
  </script>
</body>
</html>
